name: job-watcher

# Cloud cron: runs even when your laptop is off, and commits state.json back to
# the repo so dedup memory persists between runs.
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:          # allow manual "Run workflow" from the Actions tab
    inputs:
      email_first_run:
        description: "Email the full current snapshot on this run (use once, for the first run)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit updated state.json

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Headless Chromium for careers pages that only render with JavaScript
      # (Meta, Keka, Darwinbox, ...). Those boards return nothing if this fails.
      - run: python -m playwright install --with-deps chromium

      - name: Scrape and email new listings
        env:
          SENDER_GMAIL: ${{ secrets.SENDER_GMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}   # optional: turns on SEC Form D (founder names)
        run: |
          if [[ "${{ inputs.email_first_run }}" == "true" ]]; then
            python scrape.py --email-first-run --dump-matches matches.json
          else
            python scrape.py --dump-matches matches.json
          fi

      # Personal job board (board.py), published to GitHub Pages below.
      - name: Build job board
        if: hashFiles('matches.json') != ''
        continue-on-error: true
        run: |
          mkdir -p site
          python board.py --jobs matches.json --no-serve --out site/index.html --seen site_seen.json

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json site_seen.json funding.json)" ]]; then
            git config user.name "job-watcher"
            git config user.email "actions@github.com"
            git add state.json
            [[ -f funding.json ]] && git add funding.json
            [[ -f site_seen.json ]] && git add site_seen.json
            git commit -m "Update seen-jobs state [skip ci]"
            # Code may have been pushed while the scan ran; rebase the state commit onto it.
            # Only this bot writes the state files, so the rebase can't conflict with code.
            pushed=0
            for i in 1 2 3 4; do
              git push && { pushed=1; break; }
              echo "Push rejected (attempt $i); rebasing on the latest main"
              sleep $((i * 5))
              git pull --rebase origin main
            done
            [[ $pushed == 1 ]] || { echo "Could not push state after 4 attempts"; exit 1; }
          else
            echo "No state change."
          fi

      - name: Upload job board
        if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Needs Settings -> Pages -> Source: "GitHub Actions" (one-time). Until then this
  # job fails on its own without affecting the scrape or the email.
  deploy-board:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
