# Startups whose SF / Bay Area / California / NYC engineering roles are emailed
# too (own section), even without an H-1B filing history. Each company's
# existing roles are absorbed silently the first time; only new ones are sent.
# Excluded: defense/space firms whose roles need US-person status (ITAR).
us_hubs:
  stages: [research, late, series_c, series_b, series_a, seed, pre_seed]
  exclude: [SpaceX, Anduril Industries, Shield AI, Hadrian, K2 Space, Northwood Space,
            Apex Space, Varda Space, Vast Space, General Matter]
  # Their current roles are emailed once (not seeded silently): Cosign Nov 9-13 batch.
  email_backlog: [Mirendil, Fractile, Nominal, Imprint, Rox, Mavria, Daylight Security, Clara,
                  Alta, Garage, Dreeze, SE3 Labs, General Translation, Luminal, ancep, Inkbox]

# Universities, public research bodies and non-profit labs. Their listings
# (wherever located) get their own "Academic & research institutions" section
# at the top of the email, together with lab_watch updates below.
academic:
- AI4Bharat
- Caltech
- CERN
- IAIRO
- MIT CSAIL

# Academic labs with no job board: the lab page / head professor's homepage is
# fetched every run, and hiring-related sentences (hiring, postdoc, research
# engineer, openings...) are emailed when they change. LinkedIn/X profiles
# need a login, so personal homepages are used instead.
lab_watch:
  MIT OASYS (Omar Khattab):
    urls: [https://omarkhattab.com/]
  MIT CSAIL jobs page:
    urls: [https://www.csail.mit.edu/about/jobs-csail]
  Caltech - Anima Anandkumar (AI for science):
    urls: [https://tensorlab.cms.caltech.edu/users/anima/]
  Caltech - Yisong Yue (ML):
    urls: [https://www.yisongyue.com/]
  Caltech - Katie Bouman (computational imaging):
    urls: [https://users.cms.caltech.edu/~klbouman/]
  Caltech - Georgia Gkioxari (3D vision):
    urls: [https://georgiagkioxari.com/]
  Caltech - Pietro Perona (Vision Lab):
    urls: [https://www.vision.caltech.edu/openings/]
  Caltech - Adam Wierman (networks / sustainable computing):
    urls: [https://adamwierman.com/, https://adamwierman.com/join/]
  Caltech - Aaron Ames (AMBER bipedal robotics):
    urls: [http://ames.caltech.edu/]
  Caltech - Soon-Jo Chung (aerospace robotics):
    urls: [https://aerospacerobotics.caltech.edu/]
  Caltech - CAST (autonomous systems):
    urls: [https://cast.caltech.edu/]
  Caltech - IQIM (quantum):
